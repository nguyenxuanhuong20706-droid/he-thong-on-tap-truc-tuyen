services:
  - type: web
    name: ontap-backend
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    plan: free
    region: ohio
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 3000
      - key: DATABASE_URL
        value: postgresql://neondb_owner:npg_D5Wg0vnXItuh@ep-hidden-silence-bdssnhcr-pooler.c-8.us-east-2.aws.neon.tech/neondb?sslmode=require
      - key: JWT_ACCESS_SECRET
        generateValue: true
      - key: JWT_REFRESH_SECRET
        generateValue: true
      - key: JWT_ACCESS_EXPIRATION
        value: 15m
      - key: JWT_REFRESH_EXPIRATION
        value: 7d
      - key: CORS_ORIGIN
        value: https://nguyenxuanhuong20706-droid.github.io
    healthCheckPath: /api/health
